<!DOCTYPE html>
<html>
<head>
    <title>Test Auto-Simplification for Geo Commands</title>
</head>
<body>
    <h1>Testing Auto-Simplification Bug</h1>
    <p>This page will open the Redis ACL Builder and test adding all geo commands.</p>

    <button onclick="testGeoAutoSimplify()">Test Geo Auto-Simplification</button>

    <script>
        async function testGeoAutoSimplify() {
            console.log('🧪 Starting geo auto-simplification test...');

            // Open the app in a new tab
            const appWindow = window.open('http://localhost:5001', '_blank');

            // Wait for the app to load
            setTimeout(async () => {
                console.log('📱 App should be loaded, checking console...');

                // Note: Due to CORS, we can't directly interact with the opened window
                // But we can see the console output in the browser developer tools
                alert('Please check the browser console for debug output while manually clicking all geo commands in the other tab.');

            }, 3000);
        }

        // Auto-start the test
        window.onload = () => {
            console.log('Test page loaded. Click the button to start the test.');
        };
    </script>
</body>
</html>
