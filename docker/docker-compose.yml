# Redis ACL Builder - Optimized Docker Compose
# Uses multi-stage build for 79% smaller images (~253MB vs 1.23GB)

services:
  redis-acl-builder:
    image: redis-acl-builder:v1.10.0-beta
    build:
      context: ..
      dockerfile: docker/Dockerfile  # Optimized multi-stage Dockerfile
    ports:
      - "7380:7380"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7380/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    container_name: redis-acl-builder-v1.10.0-beta