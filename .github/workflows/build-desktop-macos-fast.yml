name: Build Desktop App (macOS ARM64 - Fast)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.1.5-test)'
        required: false
        default: 'manual-build'
  push:
    tags:
      - 'v*.*.*-test'
      - 'v*.*.*-debug'
      # Note: Only triggers on -test and -debug tags, not -docker or -docs

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  build-macos:
    name: Build macOS ARM64 Desktop App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-prod.txt
          pip install pyinstaller

      - name: Build Python backend with PyInstaller
        working-directory: backend
        run: |
          pyinstaller redis-acl-builder.spec
          ls -lah dist/redis-acl-builder-backend/
          # Move to project root dist/ for electron-builder
          mkdir -p ../dist
          mv dist/redis-acl-builder-backend ../dist/
          ls -lah ../dist/redis-acl-builder-backend/

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Create debug marker file for -debug builds
        working-directory: electron
        run: |
          if [[ "${{ github.ref }}" == *"-debug"* ]]; then
            echo "true" > .debug-build
            echo "✅ Created .debug-build marker file"
          else
            echo "ℹ️  Not a debug build, skipping marker file"
          fi

      - name: Build Electron app (macOS ARM64 only)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Disable code signing for now
        run: |
          # Build ARM64 only for faster testing
          # NOTE: -test and -debug builds do NOT publish to releases (artifacts only)
          # This prevents conflicts with multi-platform builds
          npx electron-builder --mac --arm64 --publish=never

      - name: List build artifacts
        working-directory: electron
        run: |
          echo "=== Build artifacts ==="
          ls -lah dist/
          echo "=== DMG and ZIP files ==="
          find dist/ -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | xargs -0 ls -lh

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-fast-build
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/latest-mac.yml
          retention-days: 7  # Shorter retention for test builds

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Determine if this is a pre-release
          if [[ "$TAG_NAME" == *-alpha* ]] || [[ "$TAG_NAME" == *-beta* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          # Create release (or update if exists)
          gh release create "$TAG_NAME" \
            --repo ${{ github.repository }} \
            --title "$TAG_NAME" \
            --notes "macOS ARM64 desktop app release - Fast build workflow" \
            $PRERELEASE_FLAG \
            --draft=false || echo "Release already exists, artifacts uploaded by electron-builder"

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display build summary
        run: |
          echo "=== macOS ARM64 Fast Build Summary ==="
          echo "Build triggered by: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo ""
          echo "=== Artifacts ==="
          find ./artifacts -type f | while read file; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            size_mb=$(echo "scale=2; $size / 1048576" | bc)
            echo "$(basename $file): ${size_mb} MB"
          done
          echo ""
          echo "✅ macOS ARM64 build complete!"
          echo "⏱️  This workflow only builds macOS ARM64 for faster testing (~2 minutes vs 5 minutes)"
