name: Build Desktop Apps (Multi-Platform)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'                    # v2.1.8 (GA releases)
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha'              # v2.1.8-alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-beta'               # v2.1.8-beta
      - 'v[0-9]+.[0-9]+.[0-9]+-desktop'            # v2.1.8-desktop (desktop-only)
      - 'v[0-9]+.[0-9]+.[0-9]+-desktop-alpha'      # v2.1.8-desktop-alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-desktop-beta'       # v2.1.8-desktop-beta
      # Note: Excludes -test, -debug, -docker, and -docs by not listing them
      #
      # -docs suffix: Use ONLY for repository docs (README.md, CLAUDE.md, docs/)
      #               NOT for app content (templates/, static/, Info page, etc.)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.3-alpha)'
        required: false
        default: 'manual-build'

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  build:
    name: Build ${{ matrix.os }} Desktop App
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (ARM64 + Intel)
          - os: macos-latest
            platform: mac
            arch: 'arm64 x64'
            python_version: '3.12'
            artifact_name: 'macos-dmg'

          # Windows build
          - os: windows-latest
            platform: win
            arch: 'x64'
            python_version: '3.12'
            artifact_name: 'windows-installer'

          # Linux build
          - os: ubuntu-latest
            platform: linux
            arch: 'x64'
            python_version: '3.12'
            artifact_name: 'linux-packages'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements-prod.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: electron/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-prod.txt
          pip install pyinstaller

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            backend/build
            backend/dist
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('backend/**/*.py', 'backend/requirements-prod.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Build Python backend with PyInstaller (macOS/Linux)
        if: matrix.platform != 'win'
        working-directory: backend
        run: |
          pyinstaller redis-acl-builder.spec
          ls -lah dist/redis-acl-builder-backend/
          # Move to project root dist/ for electron-builder
          mkdir -p ../dist
          mv dist/redis-acl-builder-backend ../dist/
          ls -lah ../dist/redis-acl-builder-backend/

      - name: Build Python backend with PyInstaller (Windows)
        if: matrix.platform == 'win'
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller redis-acl-builder.spec
          Get-ChildItem -Path dist/redis-acl-builder-backend/ -Recurse
          # Move to project root dist/ for electron-builder
          New-Item -ItemType Directory -Force -Path ../dist
          Move-Item -Path dist/redis-acl-builder-backend -Destination ../dist/
          Get-ChildItem -Path ../dist/redis-acl-builder-backend/ -Recurse

      - name: Install Electron dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: electron
        run: npm ci

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          # Build separate ARM64 and x64 DMGs (skip universal due to Python backend conflicts)
          # Add --publish=always when pushing a tag to publish to GitHub releases for auto-updates
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            npx electron-builder --mac --arm64 --x64 --publish=always
          else
            npx electron-builder --mac --arm64 --x64
          fi

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For future: Add these when code signing is set up
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Add --publish=always when pushing a tag to publish to GitHub releases for auto-updates
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            npx electron-builder --win --publish=always
          } else {
            npm run build:win
          }

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add --publish=always when pushing a tag to publish to GitHub releases for auto-updates
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            npx electron-builder --linux --publish=always
          else
            npm run build:linux
          fi

      - name: List build artifacts (macOS/Linux)
        if: matrix.platform != 'win'
        working-directory: electron
        run: |
          echo "=== Build artifacts ==="
          ls -lah dist/
          echo "=== File details ==="
          find dist/ -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -print0 | xargs -0 ls -lh

      - name: List build artifacts (Windows)
        if: matrix.platform == 'win'
        working-directory: electron
        shell: pwsh
        run: |
          Write-Host "=== Build artifacts ==="
          Get-ChildItem -Path dist/ -Recurse
          Write-Host "=== Installer files ==="
          Get-ChildItem -Path dist/ -Recurse -Include *.exe, *.zip | Select-Object Name, Length, FullName

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/latest-mac.yml
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            electron/dist/*.AppImage
            electron/dist/latest-linux.yml
          retention-days: 30

      # NOTE: Release creation moved to dedicated 'release' job below
      # This prevents duplicate releases when multiple matrix jobs complete

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Clean up draft releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking for draft releases with tag: $VERSION"

          # Get all draft release IDs for this tag
          DRAFT_IDS=$(gh api /repos/${{ github.repository }}/releases \
            --jq ".[] | select(.draft == true and .tag_name == \"$VERSION\") | .id")

          if [ -n "$DRAFT_IDS" ]; then
            echo "Found draft release(s) to delete:"
            echo "$DRAFT_IDS"

            # Delete each draft release
            for ID in $DRAFT_IDS; do
              echo "Deleting draft release ID: $ID"
              gh api -X DELETE /repos/${{ github.repository }}/releases/$ID
            done
          else
            echo "No draft releases found for tag $VERSION"
          fi

      - name: Generate release notes from commits
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Get commit messages since last tag
          PREV_TAG=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git log ${PREV_TAG}..HEAD --oneline --no-merges | wc -l | tr -d ' ')
          else
            COMMIT_COUNT=$(git log --oneline --no-merges -10 | wc -l | tr -d ' ')
          fi

          # Parse conventional commits and group by type
          feat_commits=""
          fix_commits=""
          docs_commits=""
          chore_commits=""
          other_commits=""

          if [ -n "$PREV_TAG" ]; then
            while IFS= read -r commit; do
              # Skip "Bump version" commits as they provide no user value
              if [[ $commit =~ [Bb]ump[[:space:]]version ]]; then
                continue
              fi

              if [[ $commit =~ ^feat:|^feat\( ]]; then
                msg=$(echo "$commit" | sed 's/^feat[^:]*: *//' | sed 's/^./\U&/')
                feat_commits="${feat_commits}- ${msg}"$'\n'
              elif [[ $commit =~ ^fix:|^fix\( ]]; then
                msg=$(echo "$commit" | sed 's/^fix[^:]*: *//' | sed 's/^./\U&/')
                fix_commits="${fix_commits}- ${msg}"$'\n'
              elif [[ $commit =~ ^docs:|^docs\( ]]; then
                msg=$(echo "$commit" | sed 's/^docs[^:]*: *//' | sed 's/^./\U&/')
                docs_commits="${docs_commits}- ${msg}"$'\n'
              elif [[ $commit =~ ^chore:|^chore\( ]]; then
                msg=$(echo "$commit" | sed 's/^chore[^:]*: *//' | sed 's/^./\U&/')
                chore_commits="${chore_commits}- ${msg}"$'\n'
              else
                other_commits="${other_commits}- ${commit}"$'\n'
              fi
            done < <(git log ${PREV_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Build "What's New" section from categorized commits
          WHATS_NEW="## What's New in $VERSION"$'\n\n'

          if [ -n "$feat_commits" ]; then
            WHATS_NEW="${WHATS_NEW}**✨ New Features**"$'\n'"${feat_commits}"$'\n'
          fi

          if [ -n "$fix_commits" ]; then
            WHATS_NEW="${WHATS_NEW}**🐛 Bug Fixes**"$'\n'"${fix_commits}"$'\n'
          fi

          if [ -n "$docs_commits" ]; then
            WHATS_NEW="${WHATS_NEW}**📚 Documentation**"$'\n'"${docs_commits}"$'\n'
          fi

          if [ -n "$chore_commits" ]; then
            WHATS_NEW="${WHATS_NEW}**🔧 Maintenance**"$'\n'"${chore_commits}"$'\n'
          fi

          if [ -n "$other_commits" ]; then
            WHATS_NEW="${WHATS_NEW}**Other Changes**"$'\n'"${other_commits}"$'\n'
          fi

          # Fallback if no categorized commits found
          if [ -z "$feat_commits" ] && [ -z "$fix_commits" ] && [ -z "$docs_commits" ] && [ -z "$chore_commits" ] && [ -z "$other_commits" ]; then
            WHATS_NEW="## What's New in $VERSION"$'\n\n'"Maintenance release with improvements and updates."$'\n\n'"See full changelog below for details."
          fi

          # Get full commit list for changelog section
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -10)
          fi

          # Create concise, readable release notes (similar to professional projects)
          # Group commits into simple sections: Fixed, New Features, Changes

          FIXED_SECTION=""
          FEATURES_SECTION=""
          CHANGES_SECTION=""

          # Build Fixed section from fix commits
          if [ -n "$fix_commits" ]; then
            FIXED_SECTION="## Fixed"$'\n\n'"$fix_commits"
          fi

          # Build New Features section from feat commits
          if [ -n "$feat_commits" ]; then
            FEATURES_SECTION="## New Features"$'\n\n'"$feat_commits"
          fi

          # Build Changes section from docs and chore commits
          if [ -n "$docs_commits" ] || [ -n "$chore_commits" ] || [ -n "$other_commits" ]; then
            CHANGES_SECTION="## Changes"$'\n\n'

            if [ -n "$docs_commits" ]; then
              CHANGES_SECTION="${CHANGES_SECTION}${docs_commits}"
            fi

            if [ -n "$chore_commits" ]; then
              CHANGES_SECTION="${CHANGES_SECTION}${chore_commits}"
            fi

            if [ -n "$other_commits" ]; then
              CHANGES_SECTION="${CHANGES_SECTION}${other_commits}"
            fi
          fi

          # Create clean, concise release notes
          {
            # Add Fixed section first (most important)
            if [ -n "$FIXED_SECTION" ]; then
              echo "$FIXED_SECTION"
              echo ""
            fi

            # Add New Features second
            if [ -n "$FEATURES_SECTION" ]; then
              echo "$FEATURES_SECTION"
              echo ""
            fi

            # Add Changes section last
            if [ -n "$CHANGES_SECTION" ]; then
              echo "$CHANGES_SECTION"
              echo ""
            fi

            # Add full changelog link at bottom
            if [ -n "$PREV_TAG" ]; then
              echo "---"
              echo ""
              echo "**Full Changelog**: https://github.com/markotrapani/redis-acl-builder/compare/${PREV_TAG}...${VERSION}"
            else
              echo "---"
              echo ""
              echo "**Full Changelog**: https://github.com/markotrapani/redis-acl-builder/commits/${VERSION}"
            fi
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.yml
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display build summary
        run: |
          echo "=== Build Summary ==="
          echo "Build triggered by: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo ""
          echo "=== Artifacts ==="
          find ./artifacts -type f | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            size_mb=$(echo "scale=2; $size / 1048576" | bc)
            echo "$(basename $file): ${size_mb} MB"
          done

