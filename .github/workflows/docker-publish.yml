name: Build and Publish Docker Images

# VERSION TAG STRATEGY:
#
# TRIGGERS BOTH DOCKER + DESKTOP BUILDS (semantic versions):
# - v*.*.* (no suffix)       → GA release - triggers Docker + Desktop
#   Examples: v2.1.8, v2.2.0
# - v*.*.*-alpha             → Alpha release - triggers Docker + Desktop
#   Examples: v2.1.8-alpha
# - v*.*.*-beta              → Beta release - triggers Docker + Desktop
#   Examples: v2.1.8-beta
#
# TRIGGERS DOCKER BUILD ONLY (workflow tags):
# - v*.*.*-docker            → Docker-only build (no desktop)
#   Examples: v2.1.8-docker
#
# NO DOCKER BUILD (workflow tags):
# - v*.*.*-desktop*          → Desktop-only builds (no Docker)
# - v*.*.*-test              → Local builds only (npm run build:mac) - no workflow
# - v*.*.*-test-release      → Fast ARM64 desktop build + release for auto-update testing (no Docker)
# - v*.*.*-debug             → Fast ARM64 desktop build with DevTools (no Docker)
# - v*.*.*-docs              → Documentation-only (no builds)
#   Use ONLY for repository docs (README.md, CLAUDE.md, docs/ folder)
#   NOT for app content (templates/, static/, Info page, etc.)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'                    # v2.0.0, v2.1.0, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha'              # v2.0.0-alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-beta'               # v2.0.0-beta
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'           # v2.0.0-rc1
      - 'v[0-9]+.[0-9]+.[0-9]+-docker'             # v2.1.8-docker
      # Note: Excludes -desktop, -test, -debug, and -docs suffixes
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: markotrapani608/redis-acl-builder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Clean version tags without 'v' prefix (e.g., 1.15.11-beta)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Set latest and beta tags for all version tags
            type=raw,value=latest
            type=raw,value=beta
          labels: |
            org.opencontainers.image.title=Redis Enterprise ACL Builder
            org.opencontainers.image.description=Interactive web interface for testing and validating Redis ACL rules with real-time command analysis
            org.opencontainers.image.vendor=markotrapani608
            org.opencontainers.image.url=https://github.com/markotrapani/redis-acl-builder
            org.opencontainers.image.documentation=https://github.com/markotrapani/redis-acl-builder
            org.opencontainers.image.source=https://github.com/markotrapani/redis-acl-builder

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Redis Enterprise ACL Builder with responsive design and multi-architecture support

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./docker/README.md

      - name: Docker Scout analysis
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          platform: linux/amd64
          only-severities: critical,high
          exit-code: true
