[pytest]
# Pytest configuration for Redis ACL Builder

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --color=yes

# Coverage options (when using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=app --cov=helpers --cov=models --cov-report=term-missing --cov-report=html

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    parser: marks tests for ACL parser
    validation: marks tests for Pydantic validation

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore paths
norecursedirs = .git .tox venv env __pycache__ *.egg-info

# Minimum Python version
minversion = 7.0
